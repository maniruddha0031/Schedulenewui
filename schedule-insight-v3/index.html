<script>
/* Profile menu flag "Hide how to fix" (default on): the Insights screen hides only the How to fix it
   tile; the fix steps stay in Needs Attention. Remembered per browser. */
function siSetHideFix(on){
  document.body.classList.toggle('si-hide-fix', !!on);
  const sw = document.getElementById('si-hidefix-switch');
  if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
  try { localStorage.setItem('si-hide-fix', on ? '1' : '0'); } catch (e) {}
  if (window.siV3Post) siV3Post({ type: 'si-hide-fix', on: !!on });
}
document.addEventListener('DOMContentLoaded', () => {
  let on = true; try { on = localStorage.getItem('si-hide-fix') !== '0'; } catch (e) {}
  siSetHideFix(on);
  const f = document.getElementById('si-v3-frame');
  if (f) f.addEventListener('load', () => siSetHideFix(document.body.classList.contains('si-hide-fix')));
});
window.addEventListener('message', e => { if ((e.data || {}).type === 'si-v3-ready') siSetHideFix(document.body.classList.contains('si-hide-fix')); });
</script>
